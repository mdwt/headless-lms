name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: headless_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/headless_lms_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm -r typecheck

      - run: pnpm test

      - run: pnpm build:packages

      - name: Check API docs are in sync with OpenAPI spec
        run: |
          pnpm --filter website gen:api-docs
          if [ -n "$(git status --porcelain -- apps/website/content/docs/api)" ]; then
            echo "apps/website/content/docs/api is out of sync with packages/sdk/openapi.json."
            echo "Run: pnpm --filter website gen:api-docs"
            git status --porcelain -- apps/website/content/docs/api
            exit 1
          fi
